# PostgreSQL 단독 실행용.
#
#   docker compose -f docker-compose.db.yml up -d
#   docker compose -f docker-compose.db.yml down          # 데이터는 남는다
#   docker compose -f docker-compose.db.yml down -v       # 볼륨까지 삭제
#
# 최초 1회, 앱 컨테이너와 공유할 네트워크를 만든다.
#   docker network create axcore-net
#
# 접속정보는 이 파일에 적지 않는다. INFRA/.env 에 둔다(.env* 는 .gitignore 대상). 기본값이 없으니 네 키가 다 있어야 한다.
#   POSTGRES_DB=workspace
#   POSTGRES_USER=workspace
#   POSTGRES_PASSWORD=<직접 생성>
#   POSTGRES_PORT=5432

name: axcore-db

services:
  postgres:
    # 스키마 초안이 `unique nulls not distinct` 를 쓰므로 15 이상이 필요하다.
    # (docs/db/schema-draft-v1.md)
    image: postgres:18-alpine
    container_name: axcore-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      # 값이 없으면 컨테이너를 띄우지 않는다. 기본 비밀번호를 두지 않기 위함이다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?INFRA/.env 에 POSTGRES_PASSWORD 를 설정하세요}
      TZ: Asia/Seoul
    ports:
      # 로컬 5432 가 이미 쓰이면 .env 의 POSTGRES_PORT 로 바꾼다.
      - "${POSTGRES_PORT}:5432"
    volumes:
      # 18+ 는 /var/lib/postgresql 하위에 메이저버전 디렉터리(18/docker)를 만든다.
      # /data 에 직접 마운트하면 기동 시 에러로 죽는다.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  # 앱 compose 와 공유하는 네트워크. 두 파일이 별도 프로젝트라 외부 네트워크로 잡는다.
  default:
    name: axcore-net
    external: true
