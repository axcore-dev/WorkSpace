# TLS 공통 설정. 443 server 블록마다 include 한다.
#
# 인증서 경로는 고정 심볼릭 링크다. 15-tls-bootstrap.sh 가 Let's Encrypt 인증서
# (/etc/letsencrypt/live/<PUBLIC_HOST>/)가 있으면 그쪽으로, 없으면 임시 자체서명
# (/etc/nginx/selfsigned/)으로 링크를 걸고, 파일이 바뀌면 reload 한다. 설정 파일은 바뀌지 않는다.
ssl_certificate     /etc/nginx/ssl-current/fullchain.pem;
ssl_certificate_key /etc/nginx/ssl-current/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
# TLS 1.3 은 서버 선호가 의미 없고, 1.2 는 nginx 기본 cipher 목록이 충분히 안전하다.
ssl_prefer_server_ciphers off;

ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
