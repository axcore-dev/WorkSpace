# axcore 리버스 프록시.
#
#   /api/  → BE (Spring, app:8080)      BE 컨트롤러는 전부 /api/ 로 시작한다.
#   /      → FE (Next.js, frontend:8000) _next/static 포함 나머지 전부.
#
# upstream 블록 대신 변수 + resolver 를 쓰는 이유: upstream 은 기동 시 한 번만 DNS 를 풀어서,
# FE 만 다시 배포해 컨테이너 IP 가 바뀌면 nginx 를 재시작하기 전까지 502 가 난다.
# 변수로 proxy_pass 하면 요청마다(valid 주기로) Docker 내장 DNS(127.0.0.11)에 다시 묻는다.

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 프록시 뒤에 있음을 앱에 알린다. BE 는 SERVER_FORWARD_HEADERS_STRATEGY=framework 로
    # 이 헤더를 읽어 리다이렉트 URL 과 쿠키 Secure 판단을 원래 스킴·호스트 기준으로 한다.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_http_version 1.1;

    client_max_body_size 20m;
    proxy_read_timeout   60s;

    # 컨테이너 헬스체크용. 업스트림과 무관하게 nginx 자체만 확인한다.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # BE. 끝의 슬래시 없이 변수로 넘기면 원래 URI 가 그대로 전달된다.
    location /api/ {
        set $backend http://app:8080;
        proxy_pass $backend;
    }

    # FE. Upgrade 헤더는 지금은 쓰지 않지만 실시간 기능이 붙을 때 필요하다.
    location / {
        set $frontend http://frontend:8000;
        proxy_pass $frontend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
