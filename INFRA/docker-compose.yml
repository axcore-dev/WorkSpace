# 앱 실행용: BE(Spring) + FE(Next.js) + nginx(리버스 프록시).
#
#   docker compose -f docker-compose.yml up -d --build          # 셋 다
#   docker compose -f docker-compose.yml up -d --build app      # BE 만 (로컬에서 FE 는 next dev 로 띄울 때)
#   docker compose -f docker-compose.yml logs -f app
#   docker compose -f docker-compose.yml down
#
# DB 는 docker-compose.db.yml 로 따로 띄운다. 두 파일은 별도 프로젝트이므로
# depends_on 으로 묶을 수 없고, axcore-net 네트워크로만 연결된다.
# 따라서 DB 를 먼저 올린 뒤 앱을 올린다.
#
# 최초 1회:
#   docker network create axcore-net
#
# 값은 전부 INFRA/.env 에서 온다(.env* 는 .gitignore 대상). 이 파일에는 기본값이 없어서 키가 빠지면
# 빈 값으로 들어간다(포트 키가 비면 up 이 실패한다). 필요한 키 목록(24개)은
# docs/infra/ci-cd.md 의 「INFRA/.env」 절에 있다. 이 파일에 값을 적지 않는다.
#
# 외부에서 들어오는 문은 nginx 의 ${HTTP_PORT} 하나다. app/frontend 의 호스트 포트는
# 127.0.0.1 에만 묶어 두어 서버 밖에서는 nginx 를 거치지 않고 접근할 수 없게 한다.
# 로컬에서 디버깅할 때는 여전히 localhost:8080 / localhost:8000 으로 직접 붙을 수 있다.
#
# 바인드 마운트는 쓰지 않는다. Jenkins 컨테이너 안에서 compose 를 실행할 때 호스트 경로와
# 컨테이너 경로가 달라 엉뚱한 곳을 가리키기 때문이다. 설정은 전부 이미지에 굽는다.

name: axcore-app

services:
  app:
    build:
      context: ../BE
      dockerfile: Dockerfile
    image: axcore/workspace-be:local
    container_name: axcore-be
    ports:
      - "127.0.0.1:${APP_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      TZ: Asia/Seoul
      # 힙 상한. 8GB 서버에서 Jenkins·빌드와 같이 살아야 하므로 고정한다.
      JAVA_TOOL_OPTIONS: -Xmx${BE_HEAP}

      # --- DB (호스트 `postgres` 는 docker-compose.db.yml 의 서비스명) ---
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      # --- 인증 ---
      # HS256 대칭키. 32바이트 미만이면 부팅이 막힌다. 없으면 여기서 먼저 막는다.
      JWT_SECRET: ${JWT_SECRET:?INFRA/.env 에 JWT_SECRET 를 설정하세요}
      # nginx 뒤에서 FE 와 API 가 같은 오리진이므로 허용 오리진·메일 링크·OAuth 콜백이
      # 전부 PUBLIC_URL 하나로 모인다. 예: http://1.2.3.4 또는 https://ws.example.com
      AUTH_ALLOWED_ORIGINS: ${PUBLIC_URL}
      MAIL_BASE_URL: ${PUBLIC_URL}
      # HTTPS 를 붙이기 전(http://IP)에는 false 여야 브라우저가 refresh 쿠키를 저장한다.
      # HTTPS 를 붙이면 true 로 바꾼다.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      # nginx 가 넘기는 X-Forwarded-* 를 읽게 한다 (server.forward-headers-strategy).
      SERVER_FORWARD_HEADERS_STRATEGY: framework

      # --- 소셜 로그인 (비어 있으면 그 제공자만 비활성) ---
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${PUBLIC_URL}/oauth/callback/google
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      NAVER_REDIRECT_URI: ${PUBLIC_URL}/oauth/callback/naver

      # --- 메일 · 로그 ---
      # log 모드는 확인 링크가 로그에 남는다. 실제 발송 구현이 붙으면 바꾼다 (docs/infra/ci-cd.md 「남은 일」).
      MAIL_MODE: ${MAIL_MODE}
      MAIL_FROM: ${MAIL_FROM}
      LOG_REQUESTS: ${LOG_REQUESTS}
      LOG_APP_LEVEL: ${LOG_APP_LEVEL}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ../FE
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* 는 빌드 시점에 번들에 박힌다. 같은 오리진이면 빈 값이 맞다.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        # BE 와 같은 client-id 를 쓴다. 따로 관리하지 않는다.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
    image: axcore/workspace-fe:local
    container_name: axcore-fe
    ports:
      - "127.0.0.1:${FE_PORT}:8000"
    environment:
      TZ: Asia/Seoul
    healthcheck:
      # node:alpine 에는 curl 이 없고 busybox wget 은 있다. localhost 는 ::1 로 먼저 풀리는데
      # Next 는 0.0.0.0(IPv4)에만 붙어 있어 127.0.0.1 로 적는다.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: axcore/nginx:local
    container_name: axcore-nginx
    ports:
      - "${HTTP_PORT}:80"
    # depends_on 을 두지 않는다. resolver 로 요청마다 업스트림을 찾으므로 app/frontend 가 없어도
    # nginx 는 뜨고(그동안은 502), FE 만 다시 배포해도 nginx 를 건드리지 않는다.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  # DB compose 와 공유하는 네트워크.
  default:
    name: axcore-net
    external: true
