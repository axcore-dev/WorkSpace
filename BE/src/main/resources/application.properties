spring.config.import=optional:file:.env[.properties]
spring.application.name=workspace

# 가상 스레드로 요청을 처리한다. DB·외부 연동 대기가 대부분인 워크로드라
# 플랫폼 스레드를 붙잡지 않는 편이 유리하다. (Java 21+ / docs/be/java-springboot-version.md)
spring.threads.virtual.enabled=true

# DataSource는 ORM 선택과 RLS 연동 방식이 정해진 뒤 추가한다.
# 접속정보는 환경변수로만 주입하고 이 파일에 값을 적지 않는다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway — 전역(shared) 스키마만 부팅 시 적용한다.
# 테넌트 스키마는 회사 수만큼 순회해야 해서 부팅 경로에 두지 않는다. 별도 러너로 붙인다.
# (docs/db/schema-draft-v2.md — "배포 시 전 스키마 순회")
spring.flyway.enabled=true
spring.flyway.schemas=shared
spring.flyway.locations=classpath:db/migration/shared

# 스키마를 만드는 주체는 Flyway 다. Hibernate 는 엔티티와 대조만 한다.
spring.jpa.hibernate.ddl-auto=validate

# EntityManager 를 응답이 끝날 때까지 열어 두지 않는다.
#
# 켜져 있으면 (프레임워크 기본값) 요청 시작에 EntityManager 를 열고 응답이 나갈 때 닫는다.
# 그 사이 Hikari 커넥션 하나를 잡고 있는데, 50ms 짜리 JSON API 에서는 안 보이지만 응답이 긴
# 요청에서는 아무 일도 안 하면서 커넥션을 붙잡는다. 풀이 마르면 그 요청이 느려지는 게 아니라
# **무관한 API 가 getConnection() 에서 멈춘다.** SSE 스트리밍을 붙이면 바로 드러난다.
#
# 끄면 트랜잭션 밖에서 lazy 연관을 건드리던 코드가 LazyInitializationException 을 던진다.
# 그건 이 설정이 만든 문제가 아니라 켜져 있어서 가려져 있던 것이다 — 조회는 서비스 계층
# 트랜잭션 안에서 끝내고 컨트롤러에는 DTO 를 넘긴다.
spring.jpa.open-in-view=false

# JWT — access 는 짧게 두고, 끊어야 할 때는 저장돼 있는 refresh 를 폐기한다.
# secret 은 이 파일에 적지 않는다. HS256 대칭키라 이 값을 가진 쪽은 임의의 토큰을 만들 수 있다.
# 32바이트(256비트) 미만이면 부팅 시점에 막힌다.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=axpoint
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=14d
app.jwt.short-refresh-token-ttl=12h

# refresh 쿠키. HttpOnly 는 코드에서 고정이고, 여기서는 배포 환경에 따라 달라지는 것만 받는다.
# SameSite=Lax 는 FE 와 API 가 같은 사이트일 때 동작한다. 도메인이 완전히 다르면 None + Secure 다.
app.auth.refresh-cookie-name=axp_refresh
app.auth.refresh-cookie-path=/api/auth
app.auth.refresh-cookie-secure=${AUTH_COOKIE_SECURE:true}
app.auth.refresh-cookie-same-site=Lax
# 포트 8000 은 FE 의 실제 개발 포트다 (FE/package.json — next dev -p 8000).
# Next.js 기본값 3000 을 적어 두면 FE 를 붙이는 순간 전부 CORS 에서 막힌다. 쿠키를 주고받으려면
# credentials 가 필요하고 그러면 와일드카드를 쓸 수 없어서, 값이 정확해야 한다.
app.auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:http://localhost:8000}

# 개발용 로그.
#
# app.log.requests: 요청 한 줄 로그(RequestLogFilter). 운영에서는 앞단이 남기므로 끈다.
# 우리 패키지만 DEBUG 로 둔다 - 프레임워크까지 열면 한 요청에 수십 줄이 쏟아져 오히려 안 보인다.
app.log.requests=${LOG_REQUESTS:true}
logging.level.com.axcore.workspace=${LOG_APP_LEVEL:DEBUG}

# 메일. mode=log 면 실제로 보내지 않고 콘솔에 찍는다 — 확인 링크와 인증 코드가 로그에 남으므로
# 로컬 전용이다. mode=smtp 면 SmtpMailSender 가 아래 spring.mail.* 로 실제 발송한다.
# 그 외 값은 구현체가 없어 부팅이 실패한다. 조용히 안 보내는 것보다 못 뜨는 편이 낫다.
app.mail.mode=${MAIL_MODE:log}

# SMTP 접속 정보. mode=smtp 일 때만 쓰인다. 값은 전부 환경변수에서 온다 — 비밀번호를 여기에 적지 않는다.
# Google Workspace: MAIL_HOST=smtp.gmail.com MAIL_PORT=587 MAIL_USERNAME=<계정> MAIL_PASSWORD=<앱 비밀번호>
# 587 은 STARTTLS 다. 클라우드 서버는 25 번 아웃바운드가 막혀 있는 경우가 많아 587 을 기본으로 둔다.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# 메일 서버가 응답이 없을 때 요청 스레드가 매달리지 않게 한다 (ms).
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# JavaMailSender 빈이 있으면 Actuator 가 메일 헬스 지표를 붙여 /actuator/health 마다 SMTP 에 접속한다.
# log 모드에서는 host 가 비어 항상 DOWN 이 되고, 그러면 compose 헬스체크가 BE 를 죽었다고 본다.
# smtp 모드에서도 메일 서버 장애가 API 헬스를 끌어내리면 안 되므로 끈다. 접속 확인은 부팅 때 한 번 한다.
management.health.mail.enabled=false
# 메일에 실리는 링크의 앞부분. API 주소가 아니라 사용자가 여는 화면(FE) 주소다.
# 경로는 /verify-email · /reset-password 다. FE 의 (auth) 폴더는 Next.js 라우트 그룹이라
# URL 에 나타나지 않으므로 /auth 접두어가 붙지 않는다.
app.mail.base-url=${MAIL_BASE_URL:http://localhost:8000}
app.mail.from=${MAIL_FROM:no-reply@axcore.ai.kr}

# 소셜 로그인. 값이 없으면 그 제공자만 비활성이고 부팅은 된다 — Google 자격증명을 발급받지 않은
# 개발자도 서버를 띄울 수 있어야 한다. 이 상태에서 소셜 로그인을 시도하면 503 이 난다.
#
# client-secret 은 이 파일에 적지 않는다. 이 값이 있으면 임의의 authorization code 를 토큰으로
# 바꿀 수 있다. redirect-uri 는 제공자 콘솔에 등록한 값과 문자 단위로 같아야 하며, code 를 받는
# 주체가 FE 이므로 API 주소가 아니라 FE 주소(8000)다.
app.oauth.providers.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.providers.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.providers.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8000/oauth/callback/google}

# 네이버. 규칙은 Google 과 같다.
#
# 네이버는 토큰 요청에 redirect-uri 를 보내지 않지만 값은 여전히 필요하다 — 개발자센터에
# 등록한 Callback URL 과 FE 가 만드는 주소가 같은지 확인하는 기준이고, 세 값이 모두 채워져야
# 그 제공자를 활성으로 본다(OAuthProperties.Registration#isConfigured).
#
# 제공받을 항목은 인증 URL 이 아니라 개발자센터 애플리케이션 설정에서 정한다. 거기서
# "이메일 주소" 를 필수로 체크해야 한다 — 빠지면 사용자가 동의 화면에서 거절할 수 있고,
# 이메일이 없으면 계정을 이을 수 없어 400 이 난다.
app.oauth.providers.naver.client-id=${NAVER_CLIENT_ID:}
app.oauth.providers.naver.client-secret=${NAVER_CLIENT_SECRET:}
app.oauth.providers.naver.redirect-uri=${NAVER_REDIRECT_URI:http://localhost:8000/oauth/callback/naver}
