spring.config.import=optional:file:.env[.properties]
spring.application.name=workspace

# 가상 스레드로 요청을 처리한다. DB·외부 연동 대기가 대부분인 워크로드라
# 플랫폼 스레드를 붙잡지 않는 편이 유리하다. (Java 21+ / docs/be/java-springboot-version.md)
spring.threads.virtual.enabled=true

# DataSource는 ORM 선택과 RLS 연동 방식이 정해진 뒤 추가한다.
# 접속정보는 환경변수로만 주입하고 이 파일에 값을 적지 않는다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway — 전역(shared) 스키마만 부팅 시 적용한다.
# 테넌트 스키마는 회사 수만큼 순회해야 해서 부팅 경로에 두지 않는다. 별도 러너로 붙인다.
# (docs/db/schema-draft-v2.md — "배포 시 전 스키마 순회")
spring.flyway.enabled=true
spring.flyway.schemas=shared
spring.flyway.locations=classpath:db/migration/shared

# 스키마를 만드는 주체는 Flyway 다. Hibernate 는 엔티티와 대조만 한다.
spring.jpa.hibernate.ddl-auto=validate

# JWT — access 는 짧게 두고, 끊어야 할 때는 저장돼 있는 refresh 를 폐기한다.
# secret 은 이 파일에 적지 않는다. HS256 대칭키라 이 값을 가진 쪽은 임의의 토큰을 만들 수 있다.
# 32바이트(256비트) 미만이면 부팅 시점에 막힌다.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=axpoint
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=14d
app.jwt.short-refresh-token-ttl=12h

# refresh 쿠키. HttpOnly 는 코드에서 고정이고, 여기서는 배포 환경에 따라 달라지는 것만 받는다.
# SameSite=Lax 는 FE 와 API 가 같은 사이트일 때 동작한다. 도메인이 완전히 다르면 None + Secure 다.
app.auth.refresh-cookie-name=axp_refresh
app.auth.refresh-cookie-path=/api/auth
app.auth.refresh-cookie-secure=${AUTH_COOKIE_SECURE:true}
app.auth.refresh-cookie-same-site=Lax
# 포트 8000 은 FE 의 실제 개발 포트다 (FE/package.json — next dev -p 8000).
# Next.js 기본값 3000 을 적어 두면 FE 를 붙이는 순간 전부 CORS 에서 막힌다. 쿠키를 주고받으려면
# credentials 가 필요하고 그러면 와일드카드를 쓸 수 없어서, 값이 정확해야 한다.
app.auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:http://localhost:8000}

# 메일. mode=log 면 실제로 보내지 않고 콘솔에 찍는다 — 확인 링크와 인증 코드가 로그에 남으므로
# 로컬 전용이다. 운영에서는 이 값을 바꾸고 MailSender 구현체를 등록해야 하며, 구현체 없이
# 값만 바꾸면 부팅이 실패한다. 조용히 안 보내는 것보다 못 뜨는 편이 낫다.
app.mail.mode=${MAIL_MODE:log}
# 메일에 실리는 링크의 앞부분. API 주소가 아니라 사용자가 여는 화면(FE) 주소다.
# 경로는 /verify-email · /reset-password 다. FE 의 (auth) 폴더는 Next.js 라우트 그룹이라
# URL 에 나타나지 않으므로 /auth 접두어가 붙지 않는다.
app.mail.base-url=${MAIL_BASE_URL:http://localhost:8000}
app.mail.from=${MAIL_FROM:no-reply@axcore.ai.kr}
